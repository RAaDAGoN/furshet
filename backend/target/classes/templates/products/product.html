<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${productDto.name} + ' | Детали товара'">Детали товара</title>
</head>
<body>
<div layout:fragment="content">
    <div class="max-w-[1746px] mx-auto px-4 sm:px-5 py-8">
        <!-- Кнопка назад -->
        <a th:href="@{/admin/products}"
           class="inline-flex items-center text-[#97AB94] hover:text-[#7a9185] mb-6 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd"
                      d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"
                      clip-rule="evenodd"/>
            </svg>
            Назад к списку товаров
        </a>

        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <!-- Заголовок -->
            <div class="bg-gradient-to-r from-[#97AB94] to-[#7a9185] px-6 py-4">
                <div class="flex justify-between items-center">
                    <h1 class="text-2xl font-bold text-white" th:text="${productDto.name}"></h1>
                    <form th:action="@{/admin/product/delete/{id}(id=${productDto.id})}"
                          method="post"
                          onsubmit="return confirm('Вы уверены, что хотите удалить товар ' + document.getElementById('productName').innerText + '?');">

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <button type="submit"
                                class="bg-red-600 text-white px-6 py-3 rounded-lg hover:bg-red-700 transition-colors font-medium">
                            Удалить товар
                        </button>
                    </form>
                </div>
            </div>

            <!-- Основная информация -->
            <div class="p-6">
                <form th:action="@{/admin/products/submitProduct}" th:object="${productDto}" method="post"
                      enctype="multipart/form-data">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <!-- Левая колонка - основная информация -->
                        <div>
                            <h2 class="text-xl font-semibold text-gray-800 mb-4">Основная информация</h2>

                            <dl class="space-y-4">
                                <div class="flex justify-between border-b pb-2">
                                    <dt class="text-gray-600">ID товара:</dt>
                                    <dd class="font-medium">
                                        <input type="hidden" th:field="*{id}">
                                        <span th:text="*{id}"></span>
                                    </dd>
                                </div>
                                <div class="flex justify-between border-b pb-2">
                                    <dt class="text-gray-600">Название:</dt>
                                    <dd class="font-medium">
                                        <input class="border rounded px-2 py-1 w-full" th:field="*{name}" type="text">
                                    </dd>
                                </div>
                                <div class="flex justify-between border-b pb-2">
                                    <dt class="text-gray-600">Цена:</dt>
                                    <dd class="font-bold text-lg text-[#97AB94]">
                                        <input class="border rounded px-2 py-1 w-full" th:field="*{price}" type="number">
                                    </dd>
                                </div>
                                <div class="flex justify-between border-b pb-2">
                                    <dt class="text-gray-600">Количество:</dt>
                                    <dd>
                                        <input class="border rounded px-2 py-1 w-full" th:field="*{amount}"
                                               type="number">
                                    </dd>
                                </div>
                                <div class="flex justify-between border-b pb-2">
                                    <dt class="text-gray-600">Категория:</dt>
                                    <dd>
                                        <select th:field="*{categoryId}" class="border rounded px-2 py-1 w-full">
                                            <option th:each="category : ${categories}"
                                                    th:value="${category.id}"
                                                    th:text="${category.name}">
                                            </option>
                                        </select>
                                    </dd>
                                </div>

                                <div class="flex justify-between border-b pb-2">
                                    <dt class="text-gray-600">Активен:</dt>
                                    <dd>
                                        <input type="checkbox" th:field="*{active}">
                                    </dd>
                                </div>


                            </dl>
                        </div>

                        <!-- Правая колонка - изображение -->
                        <div>
                            <table th:if="${productImages}" class="w-full border-collapse">
                                <thead>
                                <tr class="text-center">
                                    <th class="py-2">Изображение</th>
                                    <th class="py-2">Название</th>
                                    <th class="py-2">Действия</th>
                                </tr>
                                </thead>

                                <tbody id="imagesTable">
                                <tr th:each="img : ${productImages}" class="text-center align-middle">
                                    <td class="py-3">
                                        <img
                                                class="mx-auto max-w-[20%]"
                                                th:src="@{/media/{name}(name=${img.filename})}"
                                        >
                                    </td>

                                    <td class="py-3 align-middle" th:text="${img.filename}"></td>

                                    <td class="py-3 align-middle">
                                        <label class="inline-flex items-center gap-2">
                                            <input
                                                    type="checkbox"
                                                    name="deleteImageIds"
                                                    th:value="${img.id}"
                                            >
                                            удалить
                                        </label>
                                    </td>
                                </tr>
                                </tbody>
                            </table>


                            <div class="flex items-center space-x-4 justify-center">
                                <input
                                        type="file"
                                        id="imageInput"
                                        name="newImages"
                                        multiple
                                        accept="image/*"
                                        hidden
                                >
                                <label class="cursor-pointer">
                                    <button type="button"
                                            onclick="openImageDialog()"
                                            class="px-4 py-2 bg-green-500 rounded-lg hover:bg-green-600 transition-colors">
                                        Добавить +
                                    </button>
                                </label>

                            </div>
                        </div>
                    </div>

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <!-- Действия -->
                    <div class="mt-8 pt-6 border-t border-gray-200">
                        <div class="flex items-center">
                            <div>
                                <a th:href="@{/admin/products}"
                                   class="bg-gray-200 text-gray-800 px-6 py-3 rounded-lg hover:bg-gray-300 transition-colors font-medium">
                                    ← Назад к списку
                                </a>
                            </div>
                            <div class="flex space-x-4">
                                <button type="submit"
                                        class="bg-[#97AB94] text-white px-6 py-3 rounded-lg hover:bg-[#7a9185] transition-colors font-medium">
                                    Сохранить изменения
                                </button>
                            </div>
                        </div>
                    </div>



                    <div class="mt-6">
                        <h3 class="text-lg font-semibold mb-2">Метки товара</h3>

                        <div class="flex flex-wrap gap-4">
                            <label th:each="label : ${labels}"
                                   class="inline-flex items-center gap-2">

                                <input type="checkbox"
                                       th:value="${label.id}"
                                       th:field="*{labelIds}" />

                                <span th:text="${label.name}"></span>
                            </label>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <script>
        function openImageDialog() {
            document.getElementById('imageInput').click();
        }

        document.getElementById('imageInput').addEventListener('change', function () {
            const tbody = document.getElementById('imagesTable');

            for (let file of this.files) {
                const tr = document.createElement('tr');
                tr.className = 'text-center align-middle';

                const imgTd = document.createElement('td');
                imgTd.className = 'py-3';

                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                img.className = 'mx-auto max-w-[20%]';
                imgTd.appendChild(img);

                const nameTd = document.createElement('td');
                nameTd.className = 'py-3';
                nameTd.textContent = file.name;

                const actionTd = document.createElement('td');
                actionTd.className = 'py-3';
                actionTd.textContent = 'новое';

                tr.appendChild(imgTd);
                tr.appendChild(nameTd);
                tr.appendChild(actionTd);

                tbody.appendChild(tr);
            }
        });
    </script>
</div>
</body>
</html>
