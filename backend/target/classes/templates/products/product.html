<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${productDto.name} + ' | Детали товара'">Детали товара</title>
</head>
<body>
<div layout:fragment="content">
    <div class="max-w-[1746px] mx-auto px-4 sm:px-5 py-8">
        <!-- Кнопка назад -->
        <a th:href="@{/admin/products}"
           class="inline-flex items-center text-[#97AB94] hover:text-[#7a9185] mb-6 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd"
                      d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"
                      clip-rule="evenodd"/>
            </svg>
            Назад к списку товаров
        </a>

        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <!-- Заголовок -->
            <div class="bg-gradient-to-r from-[#97AB94] to-[#7a9185] px-4 sm:px-6 py-4">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 sm:gap-0">
                    <h1 class="text-xl sm:text-2xl font-bold text-white break-words" th:text="${productDto.name}"></h1>
                    <form th:if="productDto != null" th:action="@{/admin/product/delete/{id}(id=${productDto.id})}"
                          method="post"
                          onsubmit="return confirm('Вы уверены, что хотите удалить товар ' + document.getElementById('productName').innerText + '?');"
                          class="w-full sm:w-auto">

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <button type="submit"
                                th:disabled="${!canDelete}"
                                th:title="${!canDelete ? hasBlockedAttribute : ''}"
                                class="px-4 sm:px-6 py-2 sm:py-3 rounded-lg font-medium transition-colors
               bg-red-600 text-white w-full sm:w-auto
               disabled:bg-gray-400 disabled:cursor-not-allowed text-sm sm:text-base">
                            Удалить товар
                        </button>
                    </form>
                </div>
            </div>

            <!-- Основная информация -->
            <div class="p-4 sm:p-6">
                <form th:action="@{/admin/products/submitProduct}" th:object="${productDto}" method="post"
                      enctype="multipart/form-data">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 lg:gap-8">
                        <!-- Левая колонка - основная информация -->
                        <div>
                            <h2 class="text-lg sm:text-xl font-semibold text-gray-800 mb-4">Основная информация</h2>

                            <dl class="space-y-4">
                                <div class="flex flex-col sm:flex-row justify-between border-b pb-2 gap-2 sm:gap-0">
                                    <dt class="text-gray-600 text-sm sm:text-base">ID товара:</dt>
                                    <dd class="font-medium text-sm sm:text-base">
                                        <input type="hidden" th:field="*{id}">
                                        <span th:text="*{id}"></span>
                                    </dd>
                                </div>
                                <div class="flex flex-col sm:flex-row justify-between border-b pb-2 gap-2 sm:gap-0">
                                    <dt class="text-gray-600 text-sm sm:text-base">Название:</dt>
                                    <dd class="font-medium w-full sm:w-auto">
                                        <input class="border rounded px-2 py-1 w-full text-sm sm:text-base" th:field="*{name}" type="text">
                                    </dd>
                                </div>
                                <div class="flex flex-col sm:flex-row justify-between border-b pb-2 gap-2 sm:gap-0">
                                    <dt class="text-gray-600 text-sm sm:text-base">Цена:</dt>
                                    <dd class="font-bold text-lg text-[#97AB94] w-full sm:w-auto">
                                        <input class="border rounded px-2 py-1 w-full text-sm sm:text-base" th:field="*{price}"
                                               type="number">
                                    </dd>
                                </div>
                                <div class="flex flex-col sm:flex-row justify-between border-b pb-2 gap-2 sm:gap-0">
                                    <dt class="text-gray-600 text-sm sm:text-base">Количество:</dt>
                                    <dd class="w-full sm:w-auto">
                                        <input class="border rounded px-2 py-1 w-full text-sm sm:text-base" th:field="*{amount}"
                                               type="number">
                                    </dd>
                                </div>
                                <div class="flex flex-col sm:flex-row justify-between border-b pb-2 gap-2 sm:gap-0">
                                    <dt class="text-gray-600 text-sm sm:text-base">Категория:</dt>
                                    <dd class="w-full sm:w-auto">
                                        <select th:field="*{categoryId}" class="border rounded px-2 py-1 w-full text-sm sm:text-base">
                                            <option th:each="category : ${categories}"
                                                    th:value="${category.id}"
                                                    th:text="${category.name}">
                                            </option>
                                        </select>
                                    </dd>
                                </div>

                                <div class="flex flex-col sm:flex-row justify-between border-b pb-2 gap-2 sm:gap-0">
                                    <dt class="text-gray-600 text-sm sm:text-base">Активен:</dt>
                                    <dd class="text-sm sm:text-base">
                                        <input type="checkbox" th:field="*{active}" class="mt-1 sm:mt-0">
                                    </dd>
                                </div>
                                <div class="flex flex-col sm:flex-row justify-between border-b pb-2 gap-2 sm:gap-0">
                                    <dt class="text-gray-600 text-sm sm:text-base">Тип меню:</dt>
                                    <dd class="w-full sm:w-auto">
                                        <select th:field="*{typeMenu}" class="border rounded px-2 py-1 w-full text-sm sm:text-base">
                                            <option th:each="type : ${typeMenu}"
                                                    th:value="${type.name}"
                                                    th:text="${type.translate}">
                                            </option>
                                        </select>
                                    </dd>
                                </div>

                                <div class="mt-4">
                                    <dt class="text-gray-600 text-sm sm:text-base mb-2">Описание:</dt>
                                    <dd class="w-full">
                                        <textarea th:field="*{description}" rows="6" cols="30" class="border border-[#000000] w-full text-sm sm:text-base"></textarea>
                                    </dd>
                                </div>
                            </dl>

                            <div class="w-full mt-6">
                                <div class="overflow-x-auto">
                                    <table id="order-items-table" class="min-w-full">
                                        <thead class="bg-gray-50">
                                        <tr>
                                            <th scope="col"
                                                class="px-3 sm:px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">
                                                Атрибут
                                            </th>
                                            <th scope="col"
                                                class="px-3 sm:px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">
                                                Действия
                                            </th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="item, stat : *{attributeIds}" class="border-t">
                                            <!-- ID позиции -->
                                            <td class="px-3 sm:px-6 py-4">
                                                <label class="block">
                                                    <select th:field="*{attributeIds[__${stat.index}__]}" class="border rounded px-2 py-1 w-full text-sm sm:text-base">
                                                        <option th:each="attr : ${attributes}"
                                                                th:value="${attr.id}"
                                                                th:text="${attr.name}">
                                                        </option>
                                                    </select>
                                                </label>
                                            </td>
                                            <td class="px-3 sm:px-6 py-4 text-center">
                                                <button type="button" onclick="removeRow(this)" class="text-red-600 hover:text-red-800 text-sm sm:text-base">✖</button>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                                <button type="button" id="add-item-btn"
                                        class="mt-4 bg-gray-200 px-4 py-2 rounded hover:bg-gray-300 transition-colors text-sm sm:text-base">
                                    + Добавить
                                </button>
                            </div>
                        </div>

                        <!-- Правая колонка - изображение -->
                        <div class="mt-8 lg:mt-0">
                            <div th:if="${productImages}" class="overflow-x-auto">
                                <table class="w-full border-collapse min-w-full">
                                    <thead>
                                    <tr class="text-center">
                                        <th class="py-2 text-xs sm:text-sm">Изображение</th>
                                        <th class="py-2 text-xs sm:text-sm">Название</th>
                                        <th class="py-2 text-xs sm:text-sm">Действия</th>
                                    </tr>
                                    </thead>

                                    <tbody id="imagesTable">
                                    <tr th:each="img : ${productImages}" class="text-center align-middle border-t">
                                        <td class="py-3">
                                            <img
                                                    class="mx-auto max-w-full sm:max-w-[20%]"
                                                    th:src="@{/media/{name}(name=${img.filename})}"
                                            >
                                        </td>

                                        <td class="py-3 align-middle text-xs sm:text-sm" th:text="${img.filename}"></td>

                                        <td class="py-3 align-middle">
                                            <label class="inline-flex items-center gap-2 text-xs sm:text-sm">
                                                <input
                                                        type="checkbox"
                                                        name="deleteImageIds"
                                                        th:value="${img.id}"
                                                >
                                                удалить
                                            </label>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>

                            <div class="flex items-center justify-center mt-4">
                                <input
                                        type="file"
                                        id="imageInput"
                                        name="newImages"
                                        multiple
                                        accept="image/*"
                                        hidden
                                >
                                <label class="cursor-pointer">
                                    <button type="button"
                                            onclick="openImageDialog()"
                                            class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors text-sm sm:text-base">
                                        Добавить +
                                    </button>
                                </label>
                            </div>
                        </div>
                    </div>

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <!-- Действия -->
                    <div class="mt-6 sm:mt-8 pt-4 sm:pt-6 border-t border-gray-200">
                        <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div>
                                <a th:href="@{/admin/products}"
                                   class="bg-gray-200 text-gray-800 px-4 sm:px-6 py-2 sm:py-3 rounded-lg hover:bg-gray-300 transition-colors font-medium text-center text-sm sm:text-base block">
                                    ← Назад к списку
                                </a>
                            </div>
                            <div class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-4">
                                <button type="submit"
                                        class="bg-[#97AB94] text-white px-4 sm:px-6 py-2 sm:py-3 rounded-lg hover:bg-[#7a9185] transition-colors font-medium text-sm sm:text-base">
                                    Сохранить изменения
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="mt-6">
                        <h3 class="text-lg font-semibold mb-2 text-sm sm:text-base">Метки товара</h3>

                        <div class="flex flex-wrap gap-3 sm:gap-4">
                            <label th:each="label : ${labels}"
                                   class="inline-flex items-center gap-2 text-xs sm:text-sm">

                                <input type="checkbox"
                                       th:value="${label.id}"
                                       th:field="*{labelIds}"/>

                                <span th:text="${label.name}"></span>
                            </label>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        let itemIndex = [[${productDto.attributeIds != null ? productDto.attributeIds.size() : 0}]];

        document.addEventListener('DOMContentLoaded', function () {
            document
                .getElementById('add-item-btn')
                .addEventListener('click', addAttributeRow);
        });

        function addAttributeRow() {
            const tableBody = document.querySelector('#order-items-table tbody');

            const row = document.createElement('tr');
            row.className = 'border-t';

            row.innerHTML = `
            <td class="px-3 sm:px-6 py-4">
                <select name="attributeIds[${itemIndex}]"
                        class="border rounded px-2 py-1 w-full text-sm sm:text-base">
                    ${getAttributeOptions()}
                </select>
            </td>
            <td class="px-3 sm:px-6 py-4 text-center">
                <button type="button" onclick="removeRow(this)" class="text-red-600 hover:text-red-800 text-sm sm:text-base">✖</button>
            </td>
        `;

            tableBody.appendChild(row);
            itemIndex++;
        }

        function removeRow(button) {
            button.closest('tr').remove();
        }

        function getAttributeOptions() {
            let options = '';
            /*[# th:each="attr : ${attributes}"]*/
            options += `<option value="[[${attr.id}]]">[[${attr.name}]]</option>`;
            /*[/]*/
            return options;
        }
    </script>

    <script>
        const input = document.getElementById('imageInput');
        const tbody = document.getElementById('imagesTable');
        const dataTransfer = new DataTransfer();

        function openImageDialog() {
            input.click();
        }

        input.addEventListener('change', function () {
            for (const file of this.files) {
                // защита от дублей
                if ([...dataTransfer.files].some(f => f.name === file.name)) continue;

                dataTransfer.items.add(file);

                const tr = document.createElement('tr');
                tr.className = 'text-center align-middle border-t';

                const imgTd = document.createElement('td');
                imgTd.className = 'py-3';
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                img.className = 'mx-auto max-w-full sm:max-w-[20%]';
                imgTd.appendChild(img);

                const nameTd = document.createElement('td');
                nameTd.className = 'py-3 align-middle text-xs sm:text-sm';
                nameTd.textContent = file.name;

                const actionTd = document.createElement('td');
                actionTd.className = 'py-3 align-middle text-xs sm:text-sm';
                actionTd.textContent = 'новое';

                tr.appendChild(imgTd);
                tr.appendChild(nameTd);
                tr.appendChild(actionTd);

                tbody.appendChild(tr);
            }

            input.files = dataTransfer.files;
        });
    </script>
</div>
</body>
</html>
