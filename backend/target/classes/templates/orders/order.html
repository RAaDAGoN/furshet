<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="'Заказ № '+ ${orderDto.id} + ' | Детали заказа'">Детали заказа</title>
</head>
<body>
<div layout:fragment="content">
    <div class="max-w-[1746px] mx-auto px-4 sm:px-5 py-8">
        <!-- Кнопка назад -->
        <a th:href="@{/admin/orders}"
           class="inline-flex items-center text-[#97AB94] hover:text-[#7a9185] mb-6 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20">
                <path fill-rule="evenodd"
                      d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"
                      clip-rule="evenodd"/>
            </svg>
            Назад
        </a>

        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <!-- Заголовок -->
            <div class="bg-gradient-to-r from-[#97AB94] to-[#7a9185] px-4 sm:px-6 py-4">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 sm:gap-0">
                    <h1 class="text-xl sm:text-2xl font-bold text-white break-words" th:text="'Заказ № '+ ${orderDto.id}"></h1>
                    <form th:action="@{/admin/order/delete/{id}(id=${orderDto.id})}"
                          method="post"
                          onsubmit="return confirm('Удалить заказ?');"
                          class="w-full sm:w-auto">

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <button type="submit"
                                class="bg-red-600 text-white px-4 sm:px-6 py-2 sm:py-3 rounded-lg w-full sm:w-auto text-sm sm:text-base">
                            Удалить заказ
                        </button>
                    </form>
                </div>
            </div>

            <!-- Основная информация -->
            <div class="p-4 sm:p-6">
                <div>
                    <form class="flex flex-col lg:flex-row justify-between gap-6 lg:gap-10" th:action="@{/admin/order/submitProduct}" th:object="${orderDto}" method="post">
                        <div class="w-full">
                            <h2 class="text-lg sm:text-xl font-semibold text-gray-800 mb-4">Основная информация</h2>

                            <dl class="space-y-4">
                                <div class="flex flex-col sm:flex-row justify-between border-b pb-2 gap-2 sm:gap-0">
                                    <dt class="text-gray-600 text-sm sm:text-base">ID заказа:</dt>
                                    <dd class="font-medium text-sm sm:text-base">
                                        <input type="hidden" th:field="*{id}">
                                        <span th:text="*{id}"></span>
                                    </dd>
                                </div>
                                <div class="flex flex-col sm:flex-row justify-between border-b pb-2 gap-2 sm:gap-0">
                                    <dt class="text-gray-600 text-sm sm:text-base">ФИО:</dt>
                                    <dd class="font-medium w-full sm:w-auto">
                                        <label class="block w-full">
                                            <input class="border rounded w-full px-2 py-1 text-sm sm:text-base" th:field="*{FIO}" type="text">
                                        </label>
                                    </dd>
                                </div>
                                <div class="flex flex-col sm:flex-row justify-between border-b pb-2 gap-2 sm:gap-0">
                                    <dt class="text-gray-600 text-sm sm:text-base">Телефон:</dt>
                                    <dd class="font-bold text-lg text-[#97AB94] w-full sm:w-auto">
                                        <label class="block w-full">
                                            <input class="border rounded w-full px-2 py-1 text-sm sm:text-base" th:field="*{phone}" type="text">
                                        </label>
                                    </dd>
                                </div>
                                <div class="flex flex-col sm:flex-row justify-between border-b pb-2 gap-2 sm:gap-0">
                                    <dt class="text-gray-600 text-sm sm:text-base">Email:</dt>
                                    <dd class="w-full sm:w-auto">
                                        <label class="block w-full">
                                            <input class="border rounded w-full px-2 py-1 text-sm sm:text-base" th:field="*{email}" type="text">
                                        </label>
                                    </dd>
                                </div>
                                <div class="flex flex-col sm:flex-row justify-between border-b pb-2 gap-2 sm:gap-0">
                                    <dt class="text-gray-600 text-sm sm:text-base">Тип доставки:</dt>
                                    <dd class="w-full sm:w-auto">
                                        <label class="block w-full">
                                            <select th:field="*{delivery}" class="border rounded px-2 py-1 w-full text-sm sm:text-base">
                                                <option th:each="type : ${typeDelivery}"
                                                        th:value="${type.name}"
                                                        th:text="${type.name}">
                                                </option>
                                            </select>
                                        </label>
                                    </dd>
                                </div>
                                <div class="flex flex-col sm:flex-row justify-between border-b pb-2 gap-2 sm:gap-0">
                                    <dt class="text-gray-600 text-sm sm:text-base">Город:</dt>
                                    <dd class="w-full sm:w-auto">
                                        <label class="block w-full">
                                            <input class="border rounded w-full px-2 py-1 text-sm sm:text-base" th:field="*{city}" type="text">
                                        </label>
                                    </dd>
                                </div>
                                <div class="flex flex-col sm:flex-row justify-between border-b pb-2 gap-2 sm:gap-0">
                                    <dt class="text-gray-600 text-sm sm:text-base">Адрес доставки:</dt>
                                    <dd class="w-full sm:w-auto">
                                        <label class="block w-full">
                                            <input class="border rounded w-full px-2 py-1 text-sm sm:text-base" th:field="*{address}" type="text">
                                        </label>
                                    </dd>
                                </div>
                                <div class="flex flex-col sm:flex-row justify-between border-b pb-2 gap-2 sm:gap-0">
                                    <dt class="text-gray-600 text-sm sm:text-base">Комментарий к заказу:</dt>
                                    <dd class="w-full sm:w-auto">
                                        <label class="block w-full">
                                            <input class="border rounded w-full px-2 py-1 text-sm sm:text-base" th:field="*{comment}" type="text">
                                        </label>
                                    </dd>
                                </div>
                                <div class="flex flex-col sm:flex-row justify-between border-b pb-2 gap-2 sm:gap-0">
                                    <dt class="text-gray-600 text-sm sm:text-base">Тип оплаты:</dt>
                                    <dd class="w-full sm:w-auto">
                                        <label class="block w-full">
                                            <select th:field="*{paymentMethod}" class="border rounded px-2 py-1 w-full text-sm sm:text-base">
                                                <option th:each="method : ${paymentMethod}"
                                                        th:value="${method.name}"
                                                        th:text="${method.name}">
                                                </option>
                                            </select>
                                        </label>
                                    </dd>
                                </div>
                            </dl>

                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                            <!-- Действия -->
                            <div class="mt-6 sm:mt-8 pt-4 sm:pt-6">
                                <div class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-4">
                                    <a th:href="@{/admin/orders}"
                                       class="bg-gray-200 text-gray-800 px-4 sm:px-6 py-2 sm:py-3 rounded-lg hover:bg-gray-300 transition-colors font-medium text-center text-sm sm:text-base">
                                        ← Назад
                                    </a>
                                    <button type="submit"
                                            class="bg-[#97AB94] text-white px-4 sm:px-6 py-2 sm:py-3 rounded-lg hover:bg-[#7a9185] transition-colors font-medium text-sm sm:text-base">
                                        Сохранить
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="w-full mt-8 lg:mt-0">
                            <div class="overflow-x-auto">
                                <table id="order-items-table" class="min-w-full">
                                    <thead class="bg-gray-50">
                                    <tr>
                                        <th scope="col"
                                            class="px-3 sm:px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">
                                            Товар
                                        </th>
                                        <th scope="col"
                                            class="px-3 sm:px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">
                                            количество
                                        </th>
                                        <th scope="col"
                                            class="px-3 sm:px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">
                                            Действия
                                        </th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="item, stat : *{orderItems}">
                                        <!-- ID позиции -->
                                        <input type="hidden"
                                               th:field="*{orderItems[__${stat.index}__].id}"/>

                                        <td class="px-3 sm:px-6 py-4">
                                            <label class="block">
                                                <select th:field="*{orderItems[__${stat.index}__].productId}" class="border rounded px-2 py-1 w-full text-sm sm:text-base">
                                                    <option th:each="prod : ${products}"
                                                            th:value="${prod.id}"
                                                            th:text="${prod.name}">
                                                    </option>
                                                </select>
                                            </label>
                                        </td>
                                        <td class="px-3 sm:px-6 py-4">
                                            <label class="block">
                                                <input type="number"
                                                       min="1"
                                                       th:field="*{orderItems[__${stat.index}__].quantity}"
                                                       class="border rounded px-2 py-1 w-full text-sm sm:text-base"/>
                                            </label>
                                        </td>
                                        <td class="px-3 sm:px-6 py-4">
                                            <button type="button" onclick="removeRow(this)" class="text-red-600 hover:text-red-800 text-sm sm:text-base">✖</button>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                            <button type="button" id="add-item-btn"
                                    class="mt-4 bg-gray-200 px-4 py-2 rounded hover:bg-gray-300 transition-colors text-sm sm:text-base">
                                + Добавить
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        let itemIndex = [[${orderDto.orderItems != null ? orderDto.orderItems.size() : 0}]];

        document.addEventListener('DOMContentLoaded', function () {
            document
                .getElementById('add-item-btn')
                .addEventListener('click', addOrderItem);
        });

        function addOrderItem() {
            const tableBody = document.querySelector('#order-items-table tbody');

            const row = document.createElement('tr');
            row.className = 'border-t';

            row.innerHTML = `
            <td class="px-3 sm:px-6 py-4">
                <select name="orderItems[${itemIndex}].productId" class="border rounded px-2 py-1 w-full text-sm sm:text-base">
                    ${getProductOptions()}
                </select>
            </td>
            <td class="px-3 sm:px-6 py-4">
                <input type="number"
                       name="orderItems[${itemIndex}].quantity"
                       min="1"
                       value="1"
                       class="border rounded px-2 py-1 w-full text-sm sm:text-base"/>
            </td>
            <td class="px-3 sm:px-6 py-4">
                <button type="button" onclick="removeRow(this)" class="text-red-600 hover:text-red-800 text-sm sm:text-base">✖</button>
            </td>
        `;

            tableBody.appendChild(row);
            itemIndex++;
        }

        function removeRow(button) {
            button.closest('tr').remove();
        }

        function getProductOptions() {
            let options = '';
            /*[# th:each="prod : ${products}"]*/
            options += `<option value="[[${prod.id}]]">[[${prod.name}]]</option>`;
            /*[/]*/
            return options;
        }
    </script>

</div>
</body>
</html>
