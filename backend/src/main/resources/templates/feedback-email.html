<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
            border-bottom: 2px solid #2196F3;
            padding-bottom: 8px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        p {
            margin: 8px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>📦 Новый отзыв</h2>

    <table>
        <tr>
            <th>Поле</th>
            <th>Значение</th>
        </tr>
        <tr>
            <td>Фамилия и имя</td>
            <td th:text="${feedback.FI}"></td>
        </tr>
        <tr>
            <td>Дата</td>
            <td th:text="${feedback.date}"></td>
        </tr>
        <tr>
            <td>Рейтинг</td>
            <td th:text="${feedback.rating}"></td>
        </tr>
        <tr>
            <td>Отзыв</td>
            <td th:text="${feedback.comment}"></td>
        </tr>
    </table>
</div>
</body>
</html>
