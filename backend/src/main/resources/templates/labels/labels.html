<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Атрибуты</title>
</head>
<body>
<div layout:fragment="content">
    <div class="max-w-[1746px] mx-auto px-4 sm:px-5 py-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="font-bold text-2xl md:text-4xl text-[#97AB94]">Метки</h1>
            <a th:href="@{/admin/label/new}"
               class="bg-[#97AB94] text-white px-6 py-3 rounded-lg hover:bg-[#7a9185] transition-colors font-medium shadow-md">
                + Создать метку
            </a>
        </div>

        <!-- Таблица -->
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                <tr>
                    <th scope="col"
                        class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">
                        ID
                    </th>
                    <th scope="col"
                        class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">
                        Название
                    </th>
                    <th scope="col"
                        class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">
                        Действия
                    </th>

                </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-100">
                <tr th:each="label, stat : ${labels}"
                    class="hover:bg-gray-50 transition-colors duration-150"
                    th:class="${stat.odd} ? 'bg-white' : 'bg-gray-50/50'">
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="text-sm font-medium text-gray-900" th:text="${label.id}"></span>
                    </td>
                    <td class="px-6 py-4">
                        <a th:href="@{/admin/label/edit/{id}(id=${label.id})}"><span
                                class="text-sm font-semibold text-gray-900" th:text="${label.name}"></span></a>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <div class="flex space-x-3">
                            <a th:href="@{/admin/label/edit/{id}(id=${label.id})}">
                                <button class="text-blue-600 hover:text-blue-900 transition-colors">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20">
                                        <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/>
                                    </svg>
                                </button>
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
