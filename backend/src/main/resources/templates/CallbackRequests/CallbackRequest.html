<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="'Заявка № ' + ${callbackDTO.id} + ' | Детали заявки'">Детали заявки</title>
</head>
<body>
<div layout:fragment="content">
    <div class="max-w-[1746px] mx-auto px-4 sm:px-5 py-8">
        <!-- Кнопка назад -->
        <a th:href="@{/admin/callbacks}"
           class="inline-flex items-center text-[#97AB94] hover:text-[#7a9185] mb-6 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20">
                <path fill-rule="evenodd"
                      d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"
                      clip-rule="evenodd"/>
            </svg>
            Назад к списку заявок
        </a>

        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <!-- Заголовок -->
            <div class="bg-gradient-to-r from-[#97AB94] to-[#7a9185] px-4 sm:px-6 py-4">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 sm:gap-0">
                    <h1 class="text-xl sm:text-2xl font-bold text-white break-words" th:text="'Заявка № ' + ${callbackDTO.id}"></h1>
                    <form th:action="@{/admin/callback/delete/{id}(id=${callbackDTO.id})}"
                          method="post"
                          onsubmit="return confirm('Удалить заявку?');"
                          class="w-full sm:w-auto">

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <button type="submit"
                                class="bg-red-600 text-white px-4 sm:px-6 py-2 sm:py-3 rounded-lg w-full sm:w-auto text-sm sm:text-base">
                            Удалить заявку
                        </button>
                    </form>
                </div>
            </div>

            <!-- Основная информация -->
            <div class="p-4 sm:p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
                    <!-- Левая колонка - основная информация -->
                    <form th:action="@{/admin/callback/submitCallback}" th:object="${callbackDTO}" method="post">
                        <h2 class="text-lg sm:text-xl font-semibold text-gray-800 mb-4">Основная информация</h2>

                        <dl class="space-y-4">
                            <div class="flex flex-col sm:flex-row justify-between border-b pb-2 gap-2 sm:gap-0">
                                <dt class="text-gray-600 text-sm sm:text-base">ID заявки:</dt>
                                <dd class="font-medium text-sm sm:text-base">
                                    <input type="hidden" th:field="*{id}">
                                    <span th:text="*{id}"></span>
                                </dd>
                            </div>
                            <div class="flex flex-col sm:flex-row justify-between border-b pb-2 gap-2 sm:gap-0">
                                <dt class="text-gray-600 text-sm sm:text-base">Тип заявки:</dt>
                                <dd class="font-medium w-full sm:w-auto">
                                    <label class="block w-full">
                                        <select th:field="*{typeCallbackRequest}" class="border rounded px-2 py-1 w-full text-sm sm:text-base">
                                            <option th:each="callback : ${typeCallback}"
                                                    th:value="${callback.name}"
                                                    th:text="${callback.name}">
                                            </option>
                                        </select>
                                    </label>
                                </dd>
                            </div>
                            <div class="flex flex-col sm:flex-row justify-between border-b pb-2 gap-2 sm:gap-0">
                                <dt class="text-gray-600 text-sm sm:text-base">ФИО:</dt>
                                <dd class="w-full sm:w-auto">
                                    <label class="block w-full">
                                        <input class="border rounded border-gray-500 p-1 w-full text-sm sm:text-base" type="text" th:field="*{FIO}">
                                    </label>
                                </dd>
                            </div>
                            <div class="flex flex-col sm:flex-row justify-between border-b pb-2 gap-2 sm:gap-0">
                                <dt class="text-gray-600 text-sm sm:text-base">Количество людей:</dt>
                                <dd class="w-full sm:w-auto">
                                    <label class="block w-full">
                                        <input class="border rounded border-gray-500 p-1 w-full text-sm sm:text-base" type="text" th:field="*{amountPeople}">
                                    </label>
                                </dd>
                            </div>
                            <div class="flex flex-col sm:flex-row justify-between border-b pb-2 gap-2 sm:gap-0">
                                <dt class="text-gray-600 text-sm sm:text-base">Телефон:</dt>
                                <dd class="w-full sm:w-auto">
                                    <label class="block w-full">
                                        <input class="border rounded border-gray-500 p-1 w-full text-sm sm:text-base" type="text" th:field="*{phone}">
                                    </label>
                                </dd>
                            </div>
                            <div class="flex flex-col sm:flex-row justify-between border-b pb-2 gap-2 sm:gap-0">
                                <dt class="text-gray-600 text-sm sm:text-base">Email:</dt>
                                <dd class="w-full sm:w-auto">
                                    <label class="block w-full">
                                        <input class="border rounded border-gray-500 p-1 w-full text-sm sm:text-base" type="text" th:field="*{email}">
                                    </label>
                                </dd>
                            </div>
                            <div class="flex flex-col sm:flex-row justify-between border-b pb-2 gap-2 sm:gap-0">
                                <dt class="text-gray-600 text-sm sm:text-base">Дата:</dt>
                                <dd class="w-full sm:w-auto">
                                    <label class="block w-full">
                                        <input class="border rounded border-gray-500 p-1 w-full text-sm sm:text-base" type="text" th:field="*{data}">
                                    </label>
                                </dd>
                            </div>
                        </dl>

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <!-- Действия -->
                        <div class="mt-6 sm:mt-8 pt-4 sm:pt-6 border-t border-gray-200">
                            <div class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-4">
                                <a th:href="@{/admin/callbaks}"
                                   class="bg-gray-200 text-gray-800 px-4 sm:px-6 py-2 sm:py-3 rounded-lg hover:bg-gray-300 transition-colors font-medium text-center text-sm sm:text-base">
                                    ← Назад
                                </a>
                                <button type="submit"
                                        class="bg-[#97AB94] text-white px-4 sm:px-6 py-2 sm:py-3 rounded-lg hover:bg-[#7a9185] transition-colors font-medium text-sm sm:text-base">
                                    Сохранить
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
