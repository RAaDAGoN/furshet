<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>
<body>
<div class="flex flex-col items-center justify-center min-h-screen bg-gray-50">


    <h1 class="font-bold text-2xl md:text-4xl text-[#97AB94] text-center mb-10">
        Страница авторизации
    </h1>

    <!-- Сообщения об ошибках -->
    <div th:if="${param.error}" class="mb-4 p-3 bg-red-50 text-red-700 rounded">
        Неверное имя пользователя или пароль
    </div>

    <!-- Форма без явного action - Spring Security сам подставит -->
    <form class="flex flex-col gap-4" method="post">

        <input class="border border-gray-300 rounded w-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#97AB94]"
               type="text"
               name="username"
               placeholder="Username"
               required/>


        <input class="border border-gray-300 rounded w-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#97AB94]"
               type="password"
               name="password"
               placeholder="Password"
               required/>


        <button class="bg-[#97AB94] text-white rounded w-full px-4 py-2 hover:bg-[#7a8f77] transition"
                type="submit">
            Войти
        </button>

    </form>

</div>
</body>
</html>
