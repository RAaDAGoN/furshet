worker_processes 1;


events {
}

https {

	resolver 127.0.0.11 valid=10s;
	
		
	server {
		listen 80;
		listen 443 ssl;
		server_name furshetvol35.ru www.furshetvol35.ru;
		
		client_max_body_size 50M;

		location / {
			proxy_pass http://frontend:3000/;
		}
		
		location /.well-known/acme-challenege/ { root /var/www/certbot; }
		
		ssl_certificate /etc/letsencrypt/live/furshetvol35.ru/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/furshetvol35.ru/privkey.pem;
	}
	
	server {
		listen 80;
		listen 443 ssl;
		server_name api.furshetvol35.ru www.api.furshetvol35.ru;
		
		client_max_body_size 50M;

		location / {
			proxy_pass http://backend:8000/;
		}
		
		location /.well-known/acme-challenge/ { root /var/www/certbot; }
		
		ssl_certificate /etc/letsencrypt/live/furshetvol35.ru/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/furshetvol35.ru/privkey.pem;
	}

}

